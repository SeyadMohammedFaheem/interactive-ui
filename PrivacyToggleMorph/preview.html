<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Toggle Morphing Selector — Powered by GSAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      overflow: hidden;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
    }

    .backdrop.active {
      display: block;
    }

    .container-wrapper {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Speech Bubble Popover Bar */
    .popover-bar {
      position: absolute;
      bottom: 72px;
      width: 280px;
      height: 56px;
      background: #e5e5e7;
      border-radius: 999px;
      padding: 5px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      transform-origin: bottom center;
      opacity: 0;
      pointer-events: none;
    }

    /* White Indicator Pill */
    .slider-pill {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 134px;
      height: 46px;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      z-index: 1;
    }

    .option-btn {
      position: relative;
      z-index: 2;
      flex: 1;
      height: 46px;
      border: none;
      background: transparent;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: #7c7c82;
      transition: color 0.2s ease;
    }

    .option-btn.active {
      color: #000000;
      font-weight: 700;
    }

    .tail-arrow {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 14px;
      height: 14px;
      background: #e5e5e7;
      border-radius: 2px;
      z-index: 0;
    }

    /* Trigger Pill Button */
    .trigger-btn {
      height: 54px;
      padding: 0 24px;
      background: #e5e5e7;
      border-radius: 999px;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s ease;
    }

    .trigger-label {
      font-size: 18px;
      font-weight: 600;
      color: #3a3a3c;
      letter-spacing: -0.015em;
    }

    .chevron-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>

  <div class="backdrop" id="backdrop"></div>

  <div class="container-wrapper">
    <!-- Popover Speech Bubble -->
    <div class="popover-bar" id="popoverBar">
      <div class="slider-pill" id="sliderPill"></div>

      <button class="option-btn active" id="btnPrivate">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C9.24 2 7 4.24 7 7V10H6C4.9 10 4 10.9 4 12V19C4 20.1 4.9 21 6 21H18C19.1 21 20 20.1 20 19V12C20 10.9 19.1 10 18 10H17V7C17 4.24 14.76 2 12 2ZM9 7C9 5.34 10.34 4 12 4C13.66 4 15 5.34 15 7V10H9V7Z"/>
        </svg>
        <span>Private</span>
      </button>

      <button class="option-btn" id="btnPublic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <line x1="3.6" y1="9" x2="20.4" y2="9" />
          <line x1="3.6" y1="15" x2="20.4" y2="15" />
          <path d="M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18" />
        </svg>
        <span>Public</span>
      </button>

      <div class="tail-arrow"></div>
    </div>

    <!-- Main Trigger Button -->
    <button class="trigger-btn" id="triggerBtn">
      <span id="triggerIcon">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="#7c7c82">
          <path d="M12 2C9.24 2 7 4.24 7 7V10H6C4.9 10 4 10.9 4 12V19C4 20.1 4.9 21 6 21H18C19.1 21 20 20.1 20 19V12C20 10.9 19.1 10 18 10H17V7C17 4.24 14.76 2 12 2ZM9 7C9 5.34 10.34 4 12 4C13.66 4 15 5.34 15 7V10H9V7Z"/>
        </svg>
      </span>
      <span class="trigger-label" id="triggerLabel">Private</span>
      <span class="chevron-wrapper" id="chevron">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7c7c82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </span>
    </button>
  </div>

  <script>
    gsap.registerPlugin(CustomEase);
    try {
      CustomEase.create('markerBounceSmooth', 'M0,0 C0.16,1.38 0.3,1 1,1');
    } catch (e) {}

    const triggerBtn = document.getElementById('triggerBtn');
    const triggerLabel = document.getElementById('triggerLabel');
    const triggerIcon = document.getElementById('triggerIcon');
    const chevron = document.getElementById('chevron');
    const popoverBar = document.getElementById('popoverBar');
    const sliderPill = document.getElementById('sliderPill');
    const btnPrivate = document.getElementById('btnPrivate');
    const btnPublic = document.getElementById('btnPublic');
    const backdrop = document.getElementById('backdrop');

    let isExpanded = false;
    let privacyMode = 'private';

    const lockIconHtml = `<svg width="19" height="19" viewBox="0 0 24 24" fill="#7c7c82">
      <path d="M12 2C9.24 2 7 4.24 7 7V10H6C4.9 10 4 10.9 4 12V19C4 20.1 4.9 21 6 21H18C19.1 21 20 20.1 20 19V12C20 10.9 19.1 10 18 10H17V7C17 4.24 14.76 2 12 2ZM9 7C9 5.34 10.34 4 12 4C13.66 4 15 5.34 15 7V10H9V7Z"/>
    </svg>`;

    const globeIconHtml = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7c7c82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9" />
      <line x1="3.6" y1="9" x2="20.4" y2="9" />
      <line x1="3.6" y1="15" x2="20.4" y2="15" />
      <path d="M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18" />
    </svg>`;

    function toggleExpand() {
      isExpanded = !isExpanded;
      if (isExpanded) {
        backdrop.classList.add('active');
        popoverBar.style.pointerEvents = 'auto';

        gsap.to(chevron, { rotation: 180, duration: 0.32, ease: 'power2.out' });
        gsap.fromTo(popoverBar,
          { opacity: 0, y: 16, scale: 0.84 },
          { opacity: 1, y: 0, scale: 1, duration: 0.48, ease: 'markerBounceSmooth', overwrite: 'auto' }
        );
      } else {
        backdrop.classList.remove('active');
        popoverBar.style.pointerEvents = 'none';

        gsap.to(chevron, { rotation: 0, duration: 0.28, ease: 'power2.out' });
        gsap.to(popoverBar, {
          opacity: 0,
          y: 12,
          scale: 0.88,
          duration: 0.22,
          ease: 'power2.in',
          overwrite: 'auto'
        });
      }
    }

    function selectMode(mode) {
      privacyMode = mode;
      const targetLeft = mode === 'private' ? 5 : 141;

      gsap.to(sliderPill, {
        left: targetLeft,
        duration: 0.38,
        ease: 'markerBounceSmooth',
        overwrite: 'auto'
      });

      if (mode === 'private') {
        btnPrivate.classList.add('active');
        btnPublic.classList.remove('active');
        triggerLabel.textContent = 'Private';
        triggerIcon.innerHTML = lockIconHtml;
      } else {
        btnPublic.classList.add('active');
        btnPrivate.classList.remove('active');
        triggerLabel.textContent = 'Public';
        triggerIcon.innerHTML = globeIconHtml;
      }

      setTimeout(() => {
        if (isExpanded) toggleExpand();
      }, 280);
    }

    triggerBtn.addEventListener('click', toggleExpand);
    backdrop.addEventListener('click', toggleExpand);
    btnPrivate.addEventListener('click', () => selectMode('private'));
    btnPublic.addEventListener('click', () => selectMode('public'));
  </script>
</body>
</html>
