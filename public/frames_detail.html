<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #0f172a; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; }
    h2 { text-align: center; margin-bottom: 20px; }
    .section-title { margin-top: 20px; margin-bottom: 10px; font-size: 18px; color: #38bdf8; }
    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .card { background: #1e293b; border-radius: 8px; overflow: hidden; padding: 6px; text-align: center; }
    canvas { width: 100%; border-radius: 6px; background: #fff; }
    .time { font-size: 13px; font-weight: 600; color: #facc15; margin-top: 4px; }
    #status { font-size: 16px; color: #4ade80; text-align: center; margin: 15px; }
  </style>
</head>
<body>
  <h2>View on Map Morph — Micro-frame Inspector</h2>
  <div id="status">Loading video...</div>
  <video id="vid" src="khagwal_view_on_map.mp4" preload="auto" muted style="display:none"></video>

  <div class="section-title">Expansion Sequence (Pill to Square)</div>
  <div class="grid" id="grid-expand"></div>

  <div class="section-title">Collapse Sequence (Square to Pill)</div>
  <div class="grid" id="grid-collapse"></div>

  <div id="done" style="display:none; text-align:center; font-size: 20px; color: #4ade80; margin: 30px;">ALL FRAMES CAPTURED</div>

  <script>
    const vid = document.getElementById('vid');
    const status = document.getElementById('status');
    const done = document.getElementById('done');
    
    vid.addEventListener('loadeddata', async () => {
      status.textContent = 'Extracting frames...';
      const expandGrid = document.getElementById('grid-expand');
      const expandTimes = [0.0, 0.08, 0.16, 0.24, 0.32, 0.40, 0.48, 0.56, 0.64, 0.72, 0.80, 1.0];
      for (const t of expandTimes) {
        await renderFrame(t, expandGrid);
      }

      const collapseGrid = document.getElementById('grid-collapse');
      const collapseTimes = [2.7, 2.85, 2.95, 3.05, 3.15, 3.25, 3.35, 3.45, 3.55, 3.7];
      for (const t of collapseTimes) {
        await renderFrame(t, collapseGrid);
      }

      status.textContent = 'Completed!';
      done.style.display = 'block';
    });

    function renderFrame(time, container) {
      return new Promise((resolve) => {
        vid.currentTime = time;
        vid.onseeked = () => {
          const card = document.createElement('div');
          card.className = 'card';
          const canvas = document.createElement('canvas');
          canvas.width = vid.videoWidth;
          canvas.height = vid.videoHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(vid, 0, 0);
          
          const label = document.createElement('div');
          label.className = 'time';
          label.textContent = time.toFixed(2) + 's';

          card.appendChild(canvas);
          card.appendChild(label);
          container.appendChild(card);
          // small tick to let DOM breathe
          setTimeout(resolve, 30);
        };
      });
    }
  </script>
</body>
</html>
