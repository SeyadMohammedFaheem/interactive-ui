<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruler Picker Morph — Powered by GSAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4f5f7;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      padding: 24px;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Main Ruler Card */
    .ruler-card {
      position: relative;
      width: 378px;
      height: 88px;
      background: #ffffff;
      border-radius: 24px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    /* Pointer Badge */
    .pointer-container {
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .pointer-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #cfd1e3;
      margin-top: 3px;
    }

    .track-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      cursor: grab;
    }

    .track-viewport:active {
      cursor: grabbing;
    }

    /* Track */
    .track {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      will-change: transform;
    }

    .num-item {
      position: absolute;
      top: 0;
      width: 54px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 22px;
      cursor: pointer;
    }

    .num-text {
      font-size: 27px;
      letter-spacing: -0.02em;
      color: #71737c;
      font-weight: 500;
      transition: color 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
    }

    .num-text.selected {
      color: #000000;
      font-weight: 700;
      transform: scale(1.12);
    }

    .tick-tall {
      position: absolute;
      bottom: 0px;
      left: 0px;
      width: 2px;
      height: 24px;
      background: #d1d4e2;
      border-radius: 1px 1px 0 0;
    }

    .tick-medium {
      position: absolute;
      bottom: 0px;
      width: 1.6px;
      height: 16px;
      background: #dadde8;
      border-radius: 1px 1px 0 0;
    }

    .tick-short {
      position: absolute;
      bottom: 0px;
      width: 1.2px;
      height: 10px;
      background: #e6e8f2;
      border-radius: 1px 1px 0 0;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Ruler Card Container -->
    <div class="ruler-card">
      <!-- Pointer Marker (Straddles top edge) -->
      <div class="pointer-container">
        <svg width="30" height="22" viewBox="0 0 30 22" fill="none">
          <path d="M 3 0 H 27 C 28.6 0 30 1.4 30 3 V 8 C 30 12.8 15 22 15 22 C 15 22 0 12.8 0 8 V 3 C 0 1.4 1.4 0 3 0 Z" fill="#cfd1e3"/>
        </svg>
        <div class="pointer-dot"></div>
      </div>

      <!-- Viewport container with rounded clipping -->
      <div class="track-viewport" id="trackViewport">
        <!-- Horizontal Track -->
        <div class="track" id="track"></div>
      </div>
    </div>
  </div>

  <script>
    gsap.registerPlugin(CustomEase);
    try {
      CustomEase.create('markerBounceSmooth', 'M0,0 C0.16,1.38 0.3,1 1,1');
    } catch (e) {}

    const MIN_VAL = 1;
    const MAX_VAL = 100;
    const STEP_WIDTH = 54;

    const track = document.getElementById('track');
    const trackViewport = document.getElementById('trackViewport');

    let currentValue = 50;
    let currentX = getOffsetForValue(50);
    let isDragging = false;
    let startX = 0;

    function getOffsetForValue(val) {
      return 189 - (val - MIN_VAL) * STEP_WIDTH;
    }

    function getValueFromOffset(offset) {
      const rawVal = MIN_VAL + (189 - offset) / STEP_WIDTH;
      return Math.max(MIN_VAL, Math.min(MAX_VAL, Math.round(rawVal)));
    }

    // Build Track Items
    function renderTrack() {
      track.innerHTML = '';
      for (let i = MIN_VAL; i <= MAX_VAL; i++) {
        const item = document.createElement('div');
        item.className = 'num-item';
        item.style.left = `${(i - MIN_VAL) * STEP_WIDTH}px`;

        const text = document.createElement('span');
        text.className = 'num-text' + (i === currentValue ? ' selected' : '');
        text.textContent = i;
        item.appendChild(text);

        // Major Tall Tick
        const tallTick = document.createElement('div');
        tallTick.className = 'tick-tall';
        item.appendChild(tallTick);

        // 7 Subdivision ticks
        const ticksData = [
          { left: 6.75, cls: 'tick-short' },
          { left: 13.5, cls: 'tick-short' },
          { left: 20.25, cls: 'tick-short' },
          { left: 27, cls: 'tick-medium' },
          { left: 33.75, cls: 'tick-short' },
          { left: 40.5, cls: 'tick-short' },
          { left: 47.25, cls: 'tick-short' }
        ];

        ticksData.forEach(t => {
          const tickEl = document.createElement('div');
          tickEl.className = t.cls;
          tickEl.style.left = `${t.left}px`;
          item.appendChild(tickEl);
        });

        item.addEventListener('click', () => setValue(i));
        track.appendChild(item);
      }
    }

    function updateHighlight() {
      const items = track.querySelectorAll('.num-text');
      items.forEach((txt, idx) => {
        const val = MIN_VAL + idx;
        const dist = Math.abs(val - currentValue);
        if (dist === 0) {
          txt.classList.add('selected');
          txt.style.opacity = '1';
        } else {
          txt.classList.remove('selected');
          txt.style.opacity = dist === 1 ? '0.7' : dist === 2 ? '0.45' : dist === 3 ? '0.25' : '0.1';
        }
      });
    }

    function setValue(val) {
      currentValue = val;
      const targetOffset = getOffsetForValue(val);
      currentX = targetOffset;
      updateHighlight();

      gsap.to(track, {
        x: targetOffset,
        duration: 0.48,
        ease: 'markerBounceSmooth'
      });
    }

    // Pointer Events
    function onStart(e) {
      isDragging = true;
      startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      gsap.killTweensOf(track);
    }

    function onMove(e) {
      if (!isDragging) return;
      const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const delta = x - startX;
      startX = x;

      const minOffset = getOffsetForValue(MAX_VAL);
      const maxOffset = getOffsetForValue(MIN_VAL);

      currentX = Math.max(minOffset - 20, Math.min(maxOffset + 20, currentX + delta));
      gsap.set(track, { x: currentX });

      const newVal = getValueFromOffset(currentX);
      if (newVal !== currentValue) {
        currentValue = newVal;
        updateHighlight();
      }
    }

    function onEnd() {
      if (!isDragging) return;
      isDragging = false;

      const snappedVal = getValueFromOffset(currentX);
      setValue(snappedVal);
    }

    trackViewport.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    trackViewport.addEventListener('touchstart', onStart);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onEnd);

    renderTrack();
    gsap.set(track, { x: getOffsetForValue(50) });
    updateHighlight();
  </script>
</body>
</html>
