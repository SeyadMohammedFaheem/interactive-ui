<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expandable FAB Arc Menu — Powered by GSAP</title>
  <!-- Plus Jakarta Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      padding: 24px;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 560px;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.06);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.04);
    }

    .backdrop {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(3px);
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .fab-container {
      position: absolute;
      bottom: 24px;
      right: 50%;
      transform: translateX(50%);
      width: 64px;
      height: 64px;
      z-index: 20;
    }

    .fab {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      position: relative;
      z-index: 25;
    }

    .plus-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      transform: rotate(135deg);
    }

    .pill-item {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.02);
      cursor: pointer;
      white-space: nowrap;
      transform-origin: bottom right;
      z-index: 22;
      border: 1px solid rgba(0,0,0,0.03);
      opacity: 1;
      pointer-events: auto;
    }

    .pill-item .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
    }

    .pill-item .label {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    /* Arc offsets with equal spacious 32px vertical gaps across all 5 pills */
    .pill-item:nth-child(1) { bottom: 388px; left: -76px; transform: rotate(-20deg); }
    .pill-item:nth-child(2) { bottom: 312px; left: -52px; transform: rotate(-15deg); }
    .pill-item:nth-child(3) { bottom: 236px; left: -28px; transform: rotate(-10deg); }
    .pill-item:nth-child(4) { bottom: 160px; left: -4px;  transform: rotate(-5deg); }
    .pill-item:nth-child(5) { bottom: 84px;  left: 20px;  transform: rotate(0deg); }

    .toast {
      position: absolute;
      top: 24px;
      left: 24px;
      font-size: 14px;
      color: #334155;
      background: #ffffff;
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.05);
      z-index: 5;
      display: none;
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="backdrop" id="backdrop"></div>
    <div class="toast" id="toast">Selected: <strong id="toastText"></strong></div>

    <div class="fab-container">
      <!-- Arc Menu Items -->
      <div class="pill-item" data-name="Learning">
        <span class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
        </span>
        <span class="label">Learning</span>
      </div>

      <div class="pill-item" data-name="Document">
        <span class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </span>
        <span class="label">Document</span>
      </div>

      <div class="pill-item" data-name="Music">
        <span class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="8" x2="9" y2="8"></line>
            <line x1="3" y1="12" x2="9" y2="12"></line>
            <line x1="3" y1="16" x2="9" y2="16"></line>
            <circle cx="15.5" cy="16.5" r="2.5"></circle>
            <path d="M18 16.5V6.5l4-1v4"></path>
          </svg>
        </span>
        <span class="label">Music</span>
      </div>

      <div class="pill-item" data-name="Video">
        <span class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" ry="2"></rect>
            <path d="M3 9h18"></path>
            <path d="M8 5l-2 4"></path>
            <path d="M13 5l-2 4"></path>
            <path d="M18 5l-2 4"></path>
          </svg>
        </span>
        <span class="label">Video</span>
      </div>

      <div class="pill-item" data-name="Image">
        <span class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="7" width="14" height="14" rx="2" ry="2"></rect>
            <path d="M8 3h11a2 2 0 0 1 2 2v11"></path>
            <circle cx="9.5" cy="11.5" r="1.5"></circle>
            <polyline points="19 17 14 12 7 19"></polyline>
          </svg>
        </span>
        <span class="label">Image</span>
      </div>

      <!-- Main FAB Button -->
      <button class="fab" id="fabBtn">
        <span class="plus-icon" id="plusIcon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </span>
      </button>
    </div>
  </div>

  <script>
    let isOpen = true;
    const fabBtn = document.getElementById('fabBtn');
    const plusIcon = document.getElementById('plusIcon');
    const backdrop = document.getElementById('backdrop');
    const items = document.querySelectorAll('.pill-item');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');

    const startOffsets = [
      { x: 76,  y: 332 }, // Learning
      { x: 52,  y: 256 }, // Document
      { x: 28,  y: 180 }, // Music
      { x: 4,   y: 104 }, // Video
      { x: -20, y: 28 }   // Image
    ];

    function toggleMenu() {
      isOpen = !isOpen;

      if (isOpen) {
        backdrop.style.opacity = '1';
        backdrop.style.pointerEvents = 'auto';

        gsap.to(plusIcon, { rotation: 135, duration: 0.45, ease: 'back.out(1.8)' });
        gsap.fromTo(fabBtn, { scale: 0.92 }, { scale: 1, duration: 0.4, ease: 'back.out(2)' });

        items.forEach(el => el.style.pointerEvents = 'auto');
        gsap.killTweensOf(items);

        items.forEach((item, idx) => {
          const offset = startOffsets[idx] || { x: 0, y: 20 };
          gsap.fromTo(
            item,
            { opacity: 0, scale: 0.2, x: offset.x, y: offset.y, filter: 'blur(3px)' },
            {
              opacity: 1,
              scale: 1,
              x: 0,
              y: 0,
              filter: 'blur(0px)',
              duration: 0.48,
              delay: (items.length - 1 - idx) * 0.05,
              ease: 'back.out(1.6)'
            }
          );
        });
      } else {
        backdrop.style.opacity = '0';
        backdrop.style.pointerEvents = 'none';

        gsap.to(plusIcon, { rotation: 0, duration: 0.4, ease: 'power3.inOut' });

        items.forEach(el => el.style.pointerEvents = 'none');

        items.forEach((item, idx) => {
          const offset = startOffsets[idx] || { x: 0, y: 20 };
          gsap.to(item, {
            opacity: 0,
            scale: 0.25,
            x: offset.x,
            y: offset.y,
            filter: 'blur(3px)',
            duration: 0.35,
            delay: idx * 0.04,
            ease: 'power3.inOut'
          });
        });
      }
    }

    fabBtn.onclick = toggleMenu;
    backdrop.onclick = () => { if (isOpen) toggleMenu(); };

    items.forEach(item => {
      item.onmouseenter = () => {
        gsap.to(item, { scale: 1.06, boxShadow: '0 16px 36px rgba(0,0,0,0.12)', duration: 0.2 });
      };
      item.onmouseleave = () => {
        gsap.to(item, { scale: 1, boxShadow: '0 10px 28px rgba(0,0,0,0.06)', duration: 0.2 });
      };
      item.onclick = () => {
        const name = item.getAttribute('data-name');
        toastText.textContent = name;
        toast.style.display = 'block';
        toggleMenu();
      };
    });
  </script>
</body>
</html>
