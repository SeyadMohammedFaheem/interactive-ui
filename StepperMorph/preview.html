<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Glossy Continuous Squircle Pagination — Powered by GSAP</title>
  <!-- Plus Jakarta Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      padding: 24px;
    }

    .pagination-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .arrow-btn {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      transition: all 0.2s cubic-bezier(0.16, 1.38, 0.3, 1);
    }

    .track {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 56px;
    }

    .dark-glossy-pill {
      position: absolute;
      top: 0;
      left: 0;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(180deg, #2d2d38 0%, #15151c 100%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 12px 28px -4px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-sizing: border-box;
      z-index: 15;
      pointer-events: none;
      will-change: left, top, transform;
    }

    .num-btn {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      outline: none;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      color: #475569;
      font-weight: 600;
      z-index: 10;
      transition: color 0.25s ease, background-color 0.2s ease, border-color 0.2s ease, transform 0.2s cubic-bezier(0.16, 1.38, 0.3, 1);
    }

    .num-label {
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      height: 100%;
      width: 100%;
      text-align: center;
      user-select: none;
      pointer-events: none;
    }

    .num-btn.active {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      color: #ffffff !important;
      font-weight: 800 !important;
      z-index: 20 !important;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>

  <div class="pagination-wrapper">
    <!-- Prev Arrow Button -->
    <button class="arrow-btn" id="prevBtn" title="Previous Page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <!-- Number Track -->
    <div class="track" id="track">
      <!-- Continuous Dark Glossy Active Squircle Indicator -->
      <div class="dark-glossy-pill" id="darkGlossyPill"></div>
    </div>

    <!-- Next Arrow Button -->
    <button class="arrow-btn" id="nextBtn" title="Next Page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <script>
    gsap.registerPlugin(CustomEase);
    try {
      CustomEase.create('smoothEaseInOut', 'M0,0 C0.4,0 0.2,1 1,1');
    } catch(e) {}

    const TOTAL_PAGES = 5;
    let currentPage = 2; // Page 2 active like reference video
    const track = document.getElementById('track');
    const pill = document.getElementById('darkGlossyPill');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const pageButtons = [];

    // Render number buttons
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      const btn = document.createElement('button');
      btn.className = `num-btn ${i === currentPage ? 'active' : ''}`;
      
      const span = document.createElement('span');
      span.className = 'num-label';
      span.textContent = i;
      btn.appendChild(span);

      btn.onclick = () => setPage(i);
      btn.onmouseenter = () => {
        if (i !== currentPage) {
          gsap.to(btn, { y: -2, duration: 0.2, ease: 'power2.out' });
        }
      };
      btn.onmouseleave = () => {
        if (i !== currentPage) {
          gsap.to(btn, { y: 0, duration: 0.2, ease: 'power2.out' });
        }
      };
      track.appendChild(btn);
      pageButtons.push(btn);
    }

    function updatePillPosition(isInitial = false) {
      const activeBtn = pageButtons[currentPage - 1];
      const targetLeft = activeBtn.offsetLeft;
      const targetTop = activeBtn.offsetTop;

      if (isInitial) {
        gsap.set(pill, { left: targetLeft, top: targetTop });
      } else {
        gsap.to(pill, {
          left: targetLeft,
          top: targetTop,
          duration: 0.45,
          ease: 'smoothEaseInOut',
          overwrite: 'auto'
        });
      }

      pageButtons.forEach((btn, idx) => {
        const pageNum = idx + 1;
        if (pageNum === currentPage) {
          btn.classList.add('active');
          gsap.to(btn, { y: 0, duration: 0.2 });
        } else {
          btn.classList.remove('active');
        }
      });

      prevBtn.style.opacity = currentPage === 1 ? '0.35' : '1';
      prevBtn.style.cursor = currentPage === 1 ? 'default' : 'pointer';
      nextBtn.style.opacity = currentPage === TOTAL_PAGES ? '0.35' : '1';
      nextBtn.style.cursor = currentPage === TOTAL_PAGES ? 'default' : 'pointer';
    }

    function setPage(page) {
      if (page < 1 || page > TOTAL_PAGES || page === currentPage) return;

      const btn = pageButtons[page - 1];
      gsap.fromTo(btn, { scale: 0.94 }, { scale: 1, duration: 0.35, ease: 'power2.out' });

      currentPage = page;
      updatePillPosition(false);
    }

    prevBtn.onclick = () => {
      if (currentPage > 1) {
        gsap.fromTo(prevBtn, { scale: 0.94 }, { scale: 1, duration: 0.25, ease: 'power2.out' });
        setPage(currentPage - 1);
      }
    };

    nextBtn.onclick = () => {
      if (currentPage < TOTAL_PAGES) {
        gsap.fromTo(nextBtn, { scale: 0.94 }, { scale: 1, duration: 0.25, ease: 'power2.out' });
        setPage(currentPage + 1);
      }
    };

    setTimeout(() => {
      updatePillPosition(true);
    }, 10);
  </script>
</body>
</html>
