<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comment Thread Morphing Widget — Powered by GSAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      padding: 24px;
    }

    .widget-wrapper {
      width: 100%;
      max-width: 510px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Main Comment Card */
    .comment-card {
      background: #ffffff;
      border-radius: 28px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.07), 0 4px 12px rgba(0, 0, 0, 0.02);
      padding: 22px 26px 26px 26px;
      overflow: hidden;
      transition: box-shadow 0.45s ease;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
    }

    .header-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    .icon-btn:hover {
      background: #f1f5f9;
    }

    .thread-content {
      padding-top: 20px;
      display: flex;
      flex-direction: column;
    }

    .comment-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .comment-item + .comment-item,
    .typing-row {
      margin-top: 22px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-small {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 4px;
    }

    .comment-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .author-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .author-name {
      font-size: 16.5px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    .time-ago {
      font-size: 14.5px;
      font-weight: 500;
      color: #94a3b8;
    }

    .time-badge {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      background: #f1f5f9;
      padding: 2px 9px;
      border-radius: 999px;
    }

    .comment-text {
      font-size: 16px;
      line-height: 1.45;
      font-weight: 500;
      color: #334155;
      letter-spacing: -0.01em;
      margin-top: 2px;
    }

    .typing-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .typing-bubble {
      background: #f1f5f9;
      border-radius: 999px;
      padding: 8px 16px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      animation: pulseDot 1s infinite alternate ease-in-out;
    }

    @keyframes pulseDot {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Reply Input Bar */
    .reply-pill-container {
      height: 58px;
      background: #ffffff;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.02);
      padding: 6px 6px 6px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .reply-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    .send-btn {
      height: 46px;
      padding: 0 26px;
      border-radius: 999px;
      border: none;
      outline: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: #ccff00;
      color: #0f172a;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(204, 255, 0, 0.55);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .send-btn.disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: default;
      box-shadow: none;
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>

  <div class="widget-wrapper">
    <!-- Main Comment Thread Card -->
    <div class="comment-card" id="commentCard">
      <div class="card-header">
        <div class="header-title-group">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="header-title">Comment</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btnReset" style="display: none;" title="Reset Thread">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
          <button class="icon-btn" title="Mark resolved">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </button>
          <button class="icon-btn" title="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="thread-content" id="threadContent">
        <!-- Comment 1: Mike -->
        <div class="comment-item">
          <div class="avatar" style="background: #ffedd5;">
            <span style="font-size: 21px;">🧢</span>
          </div>
          <div class="comment-body">
            <div class="author-meta">
              <span class="author-name">Mike</span>
              <span class="time-ago">13 hours ago</span>
            </div>
            <p class="comment-text">Is it just me, or is the font size on this page designed for ants?</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Reply Input Pill -->
    <div class="reply-pill-container">
      <div class="avatar-small" style="background: #fce7f3;">
        <span style="font-size: 19px;">👩🏽</span>
      </div>
      <input type="text" class="reply-input" id="replyInput" value="Just do CMD + 0" placeholder="Reply...">
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const replyInput = document.getElementById('replyInput');
    const sendBtn = document.getElementById('sendBtn');
    const threadContent = document.getElementById('threadContent');
    const commentCard = document.getElementById('commentCard');
    const btnReset = document.getElementById('btnReset');

    const autoReplies = [
      'Ah, that fixed it perfectly! Thanks Emily! 🙌',
      'Whoa, super helpful! CMD + 0 worked like magic ✨',
      'Nice! That made everything crystal clear! 🚀',
      'Thanks for the tip! Appreciate it! 👍'
    ];

    let isProcessing = false;

    function updateSendBtn() {
      const text = replyInput.value.trim();
      if (text.length > 0 && !isProcessing) {
        sendBtn.classList.remove('disabled');
      } else {
        sendBtn.classList.add('disabled');
      }
    }

    replyInput.addEventListener('input', updateSendBtn);

    sendBtn.addEventListener('click', () => {
      if (isProcessing || replyInput.value.trim().length === 0) return;

      const userText = replyInput.value.trim();
      isProcessing = true;
      btnReset.style.display = 'flex';

      // 1. Append Emily's reply
      const emilyComment = document.createElement('div');
      emilyComment.className = 'comment-item';
      emilyComment.style.opacity = '0';
      emilyComment.innerHTML = `
        <div class="avatar" style="background: #fce7f3;">
          <span style="font-size: 19px;">👩🏽</span>
        </div>
        <div class="comment-body">
          <div class="author-meta">
            <span class="author-name">Emily</span>
            <span class="time-badge">just now</span>
          </div>
          <p class="comment-text">${userText}</p>
        </div>
      `;

      threadContent.appendChild(emilyComment);
      replyInput.value = '';
      replyInput.placeholder = 'Mike is replying...';
      updateSendBtn();

      gsap.fromTo(commentCard,
        { boxShadow: '0 12px 32px -6px rgba(0, 0, 0, 0.06)' },
        { boxShadow: '0 20px 48px -8px rgba(0, 0, 0, 0.1)', duration: 0.45, ease: 'power3.out' }
      );

      gsap.fromTo(emilyComment,
        { opacity: 0, y: 14, scale: 0.97 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.4)' }
      );

      // 2. Typing indicator for Mike
      let typingRow;
      setTimeout(() => {
        typingRow = document.createElement('div');
        typingRow.className = 'typing-row';
        typingRow.innerHTML = `
          <div class="avatar" style="background: #ffedd5;">
            <span style="font-size: 19px;">🧢</span>
          </div>
          <div class="typing-bubble">
            <span class="typing-dot"></span>
            <span class="typing-dot" style="animation-delay: 0.2s"></span>
            <span class="typing-dot" style="animation-delay: 0.4s"></span>
            <span style="font-size: 13px; color: #64748b; font-weight: 600; margin-left: 6px;">Mike is typing...</span>
          </div>
        `;
        threadContent.appendChild(typingRow);
      }, 400);

      // 3. Append Mike's reply back
      setTimeout(() => {
        if (typingRow) typingRow.remove();

        const mikeReplyText = autoReplies[Math.floor(Math.random() * autoReplies.length)];
        const mikeComment = document.createElement('div');
        mikeComment.className = 'comment-item';
        mikeComment.style.opacity = '0';
        mikeComment.innerHTML = `
          <div class="avatar" style="background: #ffedd5;">
            <span style="font-size: 19px;">🧢</span>
          </div>
          <div class="comment-body">
            <div class="author-meta">
              <span class="author-name">Mike</span>
              <span class="time-badge">just now</span>
            </div>
            <p class="comment-text">${mikeReplyText}</p>
          </div>
        `;

        threadContent.appendChild(mikeComment);
        gsap.fromTo(mikeComment,
          { opacity: 0, y: 14, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.4)' }
        );

        isProcessing = false;
        replyInput.placeholder = 'Reply...';
        updateSendBtn();
      }, 1500);
    });

    btnReset.addEventListener('click', () => {
      isProcessing = false;
      const comments = threadContent.querySelectorAll('.comment-item');
      comments.forEach((item, index) => {
        if (index > 0) item.remove();
      });
      const typingRow = threadContent.querySelector('.typing-row');
      if (typingRow) typingRow.remove();

      replyInput.value = 'Just do CMD + 0';
      replyInput.placeholder = 'Reply...';
      btnReset.style.display = 'none';
      updateSendBtn();
    });
  </script>
</body>
</html>
