<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Key Morphing Animation — Plus Jakarta Sans</title>
    <!-- Plus Jakarta Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Installed GSAP via npm (with CDN fallback) -->
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script>
        if (typeof gsap === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"><\\/script>');
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* The Main Morphing Capsule Container */
        .morph-capsule {
            position: relative;
            height: 56px;
            width: 254px;
            /* Collapsed width with comfortable margin */
            border-radius: 999px;
            background: #f1f2f4;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition:
                width 480ms cubic-bezier(0.16, 1.38, 0.3, 1),
                background-color 0.2s ease,
                box-shadow 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .morph-capsule:hover:not(.expanded) {
            background: #ebecee;
        }

        .morph-capsule.expanded {
            width: 364px;
            /* Expanded input width */
            cursor: default;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        /* --- Collapsed View: 100% Dead-Center in Middle --- */
        .collapsed-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1c;
            letter-spacing: -0.015em;
            white-space: nowrap;
            text-align: center;
            opacity: 1;
            transform: scale(1);
            transition:
                opacity 0.2s ease,
                transform 480ms cubic-bezier(0.16, 1.38, 0.3, 1);
            pointer-events: auto;
        }

        .morph-capsule.expanded .collapsed-label {
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
        }

        /* --- Expanded Form View --- */
        .expanded-form {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 7px 6px 20px;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.92);
            transition:
                opacity 0.28s ease 0.06s,
                transform 480ms cubic-bezier(0.16, 1.38, 0.3, 1) 0.06s;
        }

        .morph-capsule.expanded .expanded-form {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            height: 100%;
        }

        .key-input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1c;
            letter-spacing: -0.01em;
            caret-color: #1a1a1c;
        }

        .key-input::placeholder {
            color: #6b6e76;
            font-weight: 500;
            opacity: 0.85;
        }

        /* Black Activate Button */
        .activate-btn {
            height: 44px;
            padding: 0 24px;
            border-radius: 999px;
            background: #000000;
            color: #ffffff;
            border: none;
            outline: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: -0.01em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition:
                transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                background-color 0.25s ease;
            white-space: nowrap;
        }

        .activate-btn:hover {
            transform: scale(1.03);
            background: #1a1a1c;
        }

        .activate-btn:active {
            transform: scale(0.97);
        }

        .activate-btn.success,
        .activate-btn.success:hover {
            background: #10B981 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }

        /* Reset / Cancel Button */
        .cancel-btn {
            font-size: 14px;
            font-weight: 600;
            color: #8c8d94;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.2s ease, transform 0.2s ease, color 0.15s ease;
            pointer-events: none;
        }

        .cancel-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .cancel-btn:hover {
            color: #1a1a1c;
        }

        .hint {
            margin-top: 36px;
            font-size: 14px;
            color: #8c8d94;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- The Morphing Pill -->
        <div class="morph-capsule" id="morphCapsule">
            <span class="collapsed-label" id="collapsedLabel">I have a License Key</span>

            <div class="expanded-form" id="expandedForm">
                <div class="input-wrapper">
                    <input type="text" class="key-input" id="keyInput" placeholder="License Key" autocomplete="off"
                        spellcheck="false" />
                </div>
                <button class="activate-btn" id="activateBtn">Activate</button>
            </div>
        </div>

        <!-- Cancel to Collapse Back -->
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
    </div>

    <div class="hint">Click to morph the button into the input field</div>

    <script>
        const capsule = document.getElementById("morphCapsule");
        const keyInput = document.getElementById("keyInput");
        const activateBtn = document.getElementById("activateBtn");
        const cancelBtn = document.getElementById("cancelBtn");

        let isExpanded = false;

        // Click on capsule to expand
        capsule.addEventListener("click", (e) => {
            if (!isExpanded) {
                expand();
            }
        });

        function expand() {
            isExpanded = true;
            capsule.classList.add("expanded");
            cancelBtn.classList.add("visible");
            setTimeout(() => {
                keyInput.focus();
            }, 180);
        }

        function collapse() {
            isExpanded = false;
            capsule.classList.remove("expanded");
            cancelBtn.classList.remove("visible");
            keyInput.value = "";
            keyInput.blur();
            activateBtn.textContent = "Activate";
            activateBtn.classList.remove("success");
        }

        cancelBtn.addEventListener("click", () => {
            collapse();
        });

        // Activate button simulation
        activateBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (keyInput.value.trim() === "") {
                keyInput.value = "PRO-8492-NX";
            }
            keyInput.blur();
            
            // Turn emerald green and say Activated
            activateBtn.textContent = "Activated";
            activateBtn.classList.add("success");
            
            if (typeof gsap !== 'undefined') {
                gsap.fromTo(activateBtn, 
                    { scale: 0.92 }, 
                    { scale: 1, duration: 0.32, ease: "back.out(2)" }
                );
            }
            
            setTimeout(() => {
                collapse();
            }, 1400);
        });

        // Collapse on Esc key
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && isExpanded) {
                collapse();
            }
        });
    </script>
</body>

</html>
